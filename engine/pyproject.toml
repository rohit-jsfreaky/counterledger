[project]
name = "counterledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rohit-jsfreaky", email = "rohitkashyapmrt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
counterledger = "counterledger:main"
verify = "counterledger.verify:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
